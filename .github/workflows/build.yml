name: Build iOS Tweak & Standalone IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Tweak (.deb) & Standalone App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          brew install ldid dpkg || true

      - name: Setup Theos & iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git ~/theos-sdks
          cd ~/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk ~/theos/sdks/
          cd ..
          rm -rf ~/theos-sdks
          ls -la ~/theos/sdks/

      - name: Build Tweak Package (.deb)
        run: |
          export THEOS=$HOME/theos
          make clean || true
          make package FINALPACKAGE=1
          ls -la packages/

      - name: Build Standalone IPA (.ipa)
        run: |
          # Clean and setup directories
          rm -rf build output_ipa
          mkdir -p build/Payload/FluoriteMax.app
          mkdir -p output_ipa
          
          # Compile standalone App executable with xcrun SDK or Theos SDK
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "$HOME/theos/sdks/iPhoneOS16.5.sdk")
          echo "Using SDK at: $SDKPATH"
          
          clang++ -target arm64-apple-ios14.0 \
            -isysroot "$SDKPATH" \
            -I$HOME/theos/include \
            -miphoneos-version-min=14.0 \
            -std=c++17 -fobjc-arc -O2 \
            Source/Menu.mm \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics -framework AudioToolbox \
            -o build/Payload/FluoriteMax.app/FluoriteMax || true
          
          # If direct compilation produced binary or copy dylib fallback
          if [ ! -f build/Payload/FluoriteMax.app/FluoriteMax ]; then
            echo "Packaging compiled dylib into app bundle..."
            DYLIB_PATH=$(find .theos -name "*.dylib" | head -n 1)
            if [ -n "$DYLIB_PATH" ]; then
              cp "$DYLIB_PATH" build/Payload/FluoriteMax.app/FluoriteMax
            fi
          fi
          
          # Create Info.plist
          cat << 'EOF' > build/Payload/FluoriteMax.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>FluoriteMax</string>
              <key>CFBundleIdentifier</key>
              <string>com.fluoritemax.app</string>
              <key>CFBundleName</key>
              <string>Fluorite Max</string>
              <key>CFBundleDisplayName</key>
              <string>Fluorite Max</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF
          
          # Sign binary with ldid or codesign
          ldid -S build/Payload/FluoriteMax.app/FluoriteMax 2>/dev/null || codesign -s - --force build/Payload/FluoriteMax.app/FluoriteMax 2>/dev/null || true
          
          # Package IPA
          cd build
          zip -qr FluoriteMax.ipa Payload
          cd ..
          cp build/FluoriteMax.ipa output_ipa/FluoriteMax.ipa
          ls -la output_ipa/

      - name: Upload Standalone .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluorite-Max-IPA
          path: output_ipa/*.ipa
          if-no-files-found: error

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluorite-Max-Deb
          path: packages/*.deb
          if-no-files-found: error
