name: Build iOS Tweak & Standalone IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Tweak (.deb) & Standalone App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          brew install ldid dpkg || true

      - name: Setup Theos & iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git ~/theos-sdks
          cd ~/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk ~/theos/sdks/
          cd ..
          rm -rf ~/theos-sdks
          ls -la ~/theos/sdks/

      - name: Build Tweak Package (.deb)
        run: |
          export THEOS=$HOME/theos
          make clean || true
          make FINALPACKAGE=1 || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_DIR=packages || true
          
          echo "=== Built Packages ==="
          ls -lh packages/ || true

      - name: Build Standalone IPA (.ipa)
        run: |
          rm -rf build output_ipa
          mkdir -p build/Payload/FluoriteMax.app
          mkdir -p output_ipa
          
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "$HOME/theos/sdks/iPhoneOS16.5.sdk")
          echo "Compiling Standalone App with SDK: $SDKPATH"
          
          # Direct compilation of full Standalone App with all sources
          clang++ -target arm64-apple-ios14.0 \
            -isysroot "$SDKPATH" \
            -I$HOME/theos/include \
            -miphoneos-version-min=14.0 \
            -std=c++17 -fobjc-arc -O2 \
            Source/Menu.mm Source/AntiCheatBypass.mm Source/Loader.m \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics -framework AudioToolbox \
            -o build/Payload/FluoriteMax.app/FluoriteMax
          
          # Copy Info.plist
          cp Resources/Info.plist build/Payload/FluoriteMax.app/Info.plist
          
          # Sign binary with ldid
          ldid -S build/Payload/FluoriteMax.app/FluoriteMax 2>/dev/null || true
          
          # Verify App Bundle
          echo "=== App Bundle Contents ==="
          ls -lh build/Payload/FluoriteMax.app/
          
          # Package into genuine .ipa
          cd build
          zip -qr FluoriteMax.ipa Payload
          cd ..
          cp build/FluoriteMax.ipa output_ipa/FluoriteMax.ipa
          
          echo "=== Generated IPA ==="
          ls -lh output_ipa/FluoriteMax.ipa

      - name: Upload Standalone .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluorite-Max-IPA
          path: output_ipa/*.ipa
          if-no-files-found: error

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluorite-Max-Deb
          path: packages/*.deb
          if-no-files-found: warn
