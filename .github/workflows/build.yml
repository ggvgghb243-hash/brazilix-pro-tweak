name: Build iOS Tweak & Standalone IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Tweak (.deb) & Standalone App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          brew install ldid dpkg || true

      - name: Setup Theos & iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git ~/theos-sdks
          cd ~/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk ~/theos/sdks/
          cd ..
          rm -rf ~/theos-sdks
          ls -la ~/theos/sdks/

      - name: Build Tweak Package (.deb & .dylib)
        run: |
          export THEOS=$HOME/theos
          mkdir -p packages
          make clean || true
          make stage FINALPACKAGE=1 || make FINALPACKAGE=1 || true
          
          # Package .deb if staged
          if [ -d ".theos/_" ]; then
            dpkg-deb -b .theos/_ packages/com.brazilix.pro.tweak_1.0_iphoneos-arm.deb || true
          fi
          
          echo "=== Built Packages ==="
          ls -lh packages/ || true
          
          echo "=== Built Dylibs ==="
          find .theos -name "*.dylib" -exec ls -lh {} + || true

      - name: Build Standalone IPA (.ipa)
        run: |
          rm -rf build output_ipa
          mkdir -p build/Payload/FluoriteMax.app
          mkdir -p output_ipa
          
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path 2>/dev/null || echo "$HOME/theos/sdks/iPhoneOS16.5.sdk")
          echo "Compiling App Loader with SDK: $SDKPATH"
          
          # 1. Compile Loader Executable
          clang -target arm64-apple-ios14.0 \
            -isysroot "$SDKPATH" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc -O2 \
            Source/Loader.m \
            -framework UIKit -framework Foundation -framework QuartzCore \
            -o build/Payload/FluoriteMax.app/FluoriteMax
          
          # 2. Copy compiled Brazilix.dylib
          DYLIB_PATH=$(find .theos -name "Brazilix.dylib" 2>/dev/null | head -n 1)
          echo "Copying $DYLIB_PATH to App bundle..."
          if [ -n "$DYLIB_PATH" ]; then
            cp "$DYLIB_PATH" build/Payload/FluoriteMax.app/Brazilix.dylib
          fi
          
          # 3. Copy Info.plist
          cp Resources/Info.plist build/Payload/FluoriteMax.app/Info.plist
          
          # 4. Sign binary and dylib with ldid
          ldid -S build/Payload/FluoriteMax.app/FluoriteMax 2>/dev/null || true
          ldid -S build/Payload/FluoriteMax.app/Brazilix.dylib 2>/dev/null || true
          
          # 5. Verify App Bundle
          echo "=== App Bundle Contents ==="
          ls -lh build/Payload/FluoriteMax.app/
          
          # 6. Package into .ipa
          cd build
          zip -qr FluoriteMax.ipa Payload
          cd ..
          cp build/FluoriteMax.ipa output_ipa/FluoriteMax.ipa
          
          echo "=== Generated IPA ==="
          ls -lh output_ipa/FluoriteMax.ipa

      - name: Upload Standalone .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluorite-Max-IPA
          path: output_ipa/*.ipa
          if-no-files-found: error

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluorite-Max-Deb
          path: packages/*.deb
          if-no-files-found: warn
