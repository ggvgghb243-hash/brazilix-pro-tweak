name: Build iOS Tweak & Standalone IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Tweak (.deb) & Standalone App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          brew install ldid dpkg || true

      - name: Build Standalone IPA (.ipa)
        run: |
          SDKPATH=$(xcrun --sdk iphoneos --show-sdk-path)
          
          # Clean previous build
          rm -rf build output_ipa
          mkdir -p build/Payload/FluoriteMax.app
          mkdir -p output_ipa
          
          # Compile standalone App executable with the exact Menu & ESP UI
          clang++ -arch arm64 -isysroot $SDKPATH -miphoneos-version-min=14.0 \
            -std=c++11 -fobjc-arc \
            -framework UIKit -framework Foundation -framework QuartzCore -framework CoreGraphics -framework AudioToolbox \
            Source/Menu.mm Source/AntiCheatBypass.mm \
            -o build/Payload/FluoriteMax.app/FluoriteMax
          
          # Create Info.plist
          cat << 'EOF' > build/Payload/FluoriteMax.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key>
              <string>FluoriteMax</string>
              <key>CFBundleIdentifier</key>
              <string>com.fluoritemax.app</string>
              <key>CFBundleName</key>
              <string>Fluorite Max</string>
              <key>CFBundleDisplayName</key>
              <string>Fluorite Max</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>LSRequiresIPhoneOS</key>
              <true/>
              <key>UIRequiresFullScreen</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
              <key>UISupportedInterfaceOrientations~ipad</key>
              <array>
                  <string>UIInterfaceOrientationLandscapeLeft</string>
                  <string>UIInterfaceOrientationLandscapeRight</string>
              </array>
          </dict>
          </plist>
          EOF
          
          # Ad-hoc sign binary
          codesign -s - --force build/Payload/FluoriteMax.app/FluoriteMax || ldid -S build/Payload/FluoriteMax.app/FluoriteMax || true
          
          # Package IPA
          cd build
          zip -qr FluoriteMax.ipa Payload
          cd ..
          cp build/FluoriteMax.ipa output_ipa/FluoriteMax.ipa

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK for Theos
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git ~/theos-sdks
          cd ~/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk ~/theos/sdks/
          cd ..
          rm -rf ~/theos-sdks

      - name: Build Tweak Package (.deb)
        run: |
          export THEOS=$HOME/theos
          make clean || true
          make package FINALPACKAGE=1 || true

      - name: Upload Standalone .ipa Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fluorite-Max-IPA
          path: output_ipa/*.ipa
          if-no-files-found: warn

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fluorite-Max-Deb
          path: packages/*.deb
          if-no-files-found: warn
