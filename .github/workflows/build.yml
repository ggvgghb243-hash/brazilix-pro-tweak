name: Build iOS Tweak (.deb)

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Tweak (.deb)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV

      - name: Setup iOS SDK
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git ~/theos-sdks
          cd ~/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk ~/theos/sdks/
          cd ..
          rm -rf ~/theos-sdks

      - name: Build Package
        run: |
          export THEOS=$HOME/theos
          make clean
          make package FINALPACKAGE=1

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Brazilix-Tweak-Deb
          path: packages/*.deb
          if-no-files-found: error
