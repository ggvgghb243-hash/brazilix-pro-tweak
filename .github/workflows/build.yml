name: Build iOS Tweak & Standalone IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Tweak (.deb) & Standalone App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          brew install ldid dpkg || true

      - name: Setup Theos & iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git ~/theos-sdks
          cd ~/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk ~/theos/sdks/
          cd ..
          rm -rf ~/theos-sdks
          ls -la ~/theos/sdks/

      - name: Build Tweak & Standalone App via Theos
        run: |
          export THEOS=$HOME/theos
          make clean || true
          make FINALPACKAGE=1 || true
          make package FINALPACKAGE=1 || true
          
          # Show built files
          ls -la packages/ || true
          find .theos -type d -name "*.app" || true

      - name: Package Standalone IPA (.ipa)
        run: |
          rm -rf build output_ipa
          mkdir -p build/Payload
          mkdir -p output_ipa
          
          # Locate the compiled .app bundle
          APP_PATH=$(find .theos -name "FluoriteMax.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            APP_PATH=$(find . -name "FluoriteMax.app" -type d | head -n 1)
          fi
          echo "Using compiled App at: $APP_PATH"
          
          # Copy to Payload
          cp -R "$APP_PATH" build/Payload/
          
          # Sign binary with ldid
          if [ -f build/Payload/FluoriteMax.app/FluoriteMax ]; then
            ldid -S build/Payload/FluoriteMax.app/FluoriteMax 2>/dev/null || true
          fi
          
          # Package valid IPA
          cd build
          zip -qr FluoriteMax.ipa Payload
          cd ..
          cp build/FluoriteMax.ipa output_ipa/FluoriteMax.ipa
          
          # Verify IPA size and content
          ls -lh output_ipa/FluoriteMax.ipa

      - name: Upload Standalone .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluorite-Max-IPA
          path: output_ipa/*.ipa
          if-no-files-found: warn

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Fluorite-Max-Deb
          path: packages/*.deb
          if-no-files-found: warn
