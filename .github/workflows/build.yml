name: Build iOS Tweak & Standalone IPA

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Tweak (.deb) & Standalone App (.ipa)
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Build Tools
        run: |
          brew install ldid dpkg || true

      - name: Setup Theos & iOS SDK
        run: |
          git clone --recursive https://github.com/theos/theos.git ~/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          
          git clone --depth 1 --filter=blob:none --sparse https://github.com/theos/sdks.git ~/theos-sdks
          cd ~/theos-sdks
          git sparse-checkout set iPhoneOS16.5.sdk
          cp -R iPhoneOS16.5.sdk ~/theos/sdks/
          cd ..
          rm -rf ~/theos-sdks
          ls -la ~/theos/sdks/

      - name: Build Tweak & Standalone App via Theos
        run: |
          export THEOS=$HOME/theos
          make clean || true
          make FINALPACKAGE=1 || true
          make package FINALPACKAGE=1 || true
          
          # Show built files
          ls -la packages/ || true
          find .theos -type d -name "*.app" 2>/dev/null || true

      - name: Package Standalone IPA (.ipa)
        run: |
          rm -rf build output_ipa extracted
          mkdir -p build/Payload
          mkdir -p output_ipa
          
          # Option 1: Find FluoriteMax.app in .theos
          APP_PATH=$(find .theos -type d -name "FluoriteMax.app" 2>/dev/null | head -n 1)
          
          # Option 2: Extract from compiled deb if exists
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            echo "Extracting deb to locate app..."
            for deb in packages/*.deb; do
              if [ -f "$deb" ]; then
                mkdir -p extracted
                dpkg -x "$deb" extracted/ 2>/dev/null || true
              fi
            done
            APP_PATH=$(find extracted -type d -name "*.app" 2>/dev/null | head -n 1)
          fi
          
          # Fallback: search anywhere
          if [ -z "$APP_PATH" ] || [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find . -type d -name "*.app" ! -path "*/Payload/*" 2>/dev/null | head -n 1)
          fi
          
          echo "Selected App Path: $APP_PATH"
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            cp -R "$APP_PATH" build/Payload/FluoriteMax.app
          fi
          
          # Ensure Info.plist is inside FluoriteMax.app
          if [ ! -f build/Payload/FluoriteMax.app/Info.plist ]; then
            cp Resources/Info.plist build/Payload/FluoriteMax.app/Info.plist 2>/dev/null || true
          fi
          
          # Ad-hoc sign the app binary
          ldid -S build/Payload/FluoriteMax.app/FluoriteMax 2>/dev/null || codesign -s - --force --deep build/Payload/FluoriteMax.app 2>/dev/null || true
          
          # Zip into genuine .ipa
          cd build
          zip -qr FluoriteMax.ipa Payload
          cd ..
          cp build/FluoriteMax.ipa output_ipa/FluoriteMax.ipa
          
          ls -lh output_ipa/FluoriteMax.ipa

      - name: Upload Standalone .ipa Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fluorite-Max-IPA
          path: output_ipa/*.ipa
          if-no-files-found: warn

      - name: Upload .deb Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Fluorite-Max-Deb
          path: packages/*.deb
          if-no-files-found: warn
